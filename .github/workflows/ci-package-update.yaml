name: 🔂 CI Package Updates

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: '${{ github.repository_id }}-${{ github.ref_name }}'
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

jobs:
  package-update:
    name: Update packages
    uses: stairwaytowonderland/.github/.github/workflows/ci-package-update.yaml@v1
    secrets: inherit
    with:
      ignore-events: ''

  debug:
    needs: [package-update]
    name: Debug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Show outputs
        run: |
          echo "${{ toJson(needs.package-update.outputs) }}"
