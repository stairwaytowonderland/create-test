# https://github.com/actions/starter-workflows/blob/main/code-scanning/codeql.yml
# https://github.com/actions/reusable-workflows/blob/main/.github/workflows/codeql-analysis.yml
# This workflow uses the CodeQL Action to analyze code for security vulnerabilities and errors.
# The file extension must be .yml for CodeQL to recognize it.
name: 🚦 Code Quality (CodeQL)

on:
  schedule:
    - cron: '31 7 * * 2'
      timezone: America/Chicago
  pull_request:
    branches:
      - main
    paths-ignore:
      # Exclude all root-level hidden directories and files (except .github)
      - '.devcontainer/**'
      - '.licenses/**'
      - '.vscode/**'

      # Other asset and documentation exclusions
      - 'badges/**'
      - '**/docs/**'
      - '**/*.md'
      - '**/*.rst'
      - 'LICENSE'
  push:
    branches:
      - main
    paths-ignore:
      # Exclude all root-level hidden directories and files (except .github)
      - '.devcontainer/**'
      - '.licenses/**'
      - '.vscode/**'

      # Other asset and documentation exclusions
      - 'badges/**'
      - '**/docs/**'
      - '**/*.md'
      - '**/*.rst'
      - 'LICENSE'

permissions:
  actions: read
  # checks: write
  contents: read
  security-events: write

jobs:
  codeql-analysis:
    if: |
      github.actor != 'github-actions[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]' &&
      github.actor != 'semantic-release[bot]' &&
      github.actor != 'semantic-release-bot'
    uses: actions/reusable-workflows/.github/workflows/codeql-analysis.yml@main
    with:
      languages: '["typescript"]'
      codeql-cfg-path: '.github/codeql/codeql-config.yml'
