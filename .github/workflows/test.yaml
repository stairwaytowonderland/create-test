name: 🔔 CI Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/**'
      - 'src/**'
      - 'package*.json'
      - 'action.y*ml'
  # push:
  #   branches:
  #     - main
  #   paths:
  #     # - '.github/**'
  #     - 'src/**'
  #     - 'package*json'
  #     - 'action.yaml'
  workflow_call:
    inputs:
      milliseconds:
        description: 'Milliseconds to wait'
        type: number
        default: 2000
  workflow_dispatch:
    inputs:
      milliseconds:
        description: 'Milliseconds to wait'
        type: number
        default: 2000

permissions:
  contents: read

jobs:
  check-changed:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && ! startsWith(github.ref, 'refs/tags/'))
    name: Check Changed Files
    permissions:
      contents: read
    uses: stairwaytowonderland/.github/.github/workflows/check-changed.yaml@v1
    with:
      paths: |
        .github/**
        src/**
        package*.json
        action.y*ml
      ignore-authors: |
        github-actions[bot]
        semantic-release-bot

  basic-validation:
    if: needs.check-changed.outputs.result == 'true'
    name: Basic Validation
    needs: check-changed
    uses: actions/reusable-workflows/.github/workflows/basic-validation.yml@main
    permissions:
      contents: read
    with:
      operating-systems: '["ubuntu-latest"]'
      enable-audit: false

  test-action:
    if: needs.check-changed.outputs.result == 'true'
    name: GitHub Actions Test
    needs: check-changed
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v7

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          milliseconds: ${{ inputs.milliseconds || 1000 }}

      - name: Print Output
        id: output
        run: echo "${{ steps.test-action.outputs.time }}"
