name: 🔔 CI Tests

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/**'
      - 'src/**'
      - 'package*json'
      - 'action.yaml'
  # push:
  #   branches:
  #     - main
  #   paths:
  #     # - '.github/**'
  #     - 'src/**'
  #     - 'package*json'
  #     - 'action.yaml'
  workflow_call:
    inputs:
      milliseconds:
        description: 'Milliseconds to wait'
        type: number
        default: 2000
  workflow_dispatch:
    inputs:
      milliseconds:
        description: 'Milliseconds to wait'
        type: number
        default: 2000

permissions:
  contents: read
  actions: read

jobs:
  check-changed:
    name: Check Changed Files
    permissions:
      contents: read
    uses: stairwaytowonderland/.github/.github/workflows/check-changed.yaml@v1
